version: '3.8'

services:
  # ==========================================
  # 1. API GATEWAY (NGINX Reverse Proxy)
  # ==========================================
  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    container_name: mother_api_gateway
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - auth_service
      - finance_service
      - chat_service
      - dora_service
      - presentation_service
    restart: unless-stopped
    networks:
      - mother_mesh

  # ==========================================
  # 2. CENTRALIZED AUTH & CORE SERVICE (:8001)
  # ==========================================
  auth_service:
    build:
      context: ..
      dockerfile: services/auth_service/Dockerfile
    container_name: mother_auth_service
    environment:
      - PORT=8001
      - AUTH_DATABASE_URL=postgresql://vitya_user:vitya_secret@postgres:5432/auth_db
      - JWT_ISSUER=https://auth.vitya.ai
      - JWT_AUDIENCE=vitya-services
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - mother_mesh

  # ==========================================
  # 3. FINANCE MICROSERVICE (:8002)
  # ==========================================
  finance_service:
    build:
      context: ..
      dockerfile: services/finance_service/Dockerfile
    container_name: mother_finance_service
    environment:
      - PORT=8002
      - FINANCE_DATABASE_URL=postgresql://vitya_user:vitya_secret@postgres:5432/finance_db
      - AUTH_SERVICE_JWKS_URL=http://auth_service:8001/api/auth/.well-known/jwks.json
    depends_on:
      - postgres
      - auth_service
    restart: unless-stopped
    networks:
      - mother_mesh

  # ==========================================
  # 4. CHAT MICROSERVICE (:8003)
  # ==========================================
  chat_service:
    build:
      context: ..
      dockerfile: services/chat_service/Dockerfile
    container_name: mother_chat_service
    environment:
      - PORT=8003
      - CHAT_DATABASE_URL=postgresql://vitya_user:vitya_secret@postgres:5432/chat_db
      - AUTH_SERVICE_JWKS_URL=http://auth_service:8001/api/auth/.well-known/jwks.json
      - FINANCE_SERVICE_URL=http://finance_service:8002
      - DORA_SERVICE_URL=http://dora_service:8004
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - postgres
      - auth_service
      - finance_service
      - dora_service
    restart: unless-stopped
    networks:
      - mother_mesh

  # ==========================================
  # 5. DORA CLINICAL MICROSERVICE (:8004)
  # ==========================================
  dora_service:
    build:
      context: ..
      dockerfile: services/dora_service/Dockerfile
    container_name: mother_dora_service
    environment:
      - PORT=8004
      - AUTH_SERVICE_JWKS_URL=http://auth_service:8001/api/auth/.well-known/jwks.json
    restart: unless-stopped
    networks:
      - mother_mesh

  # ==========================================
  # 6. PRESENTATION STUDIO SERVICE (:8005)
  # ==========================================
  presentation_service:
    build:
      context: ..
      dockerfile: services/presentation_service/Dockerfile
    container_name: mother_presentation_service
    environment:
      - PORT=8005
      - PRESENTATION_DATABASE_URL=postgresql://vitya_user:vitya_secret@postgres:5432/presentation_db
      - AUTH_SERVICE_JWKS_URL=http://auth_service:8001/api/auth/.well-known/jwks.json
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - UNSPLASH_ACCESS_KEY=${UNSPLASH_ACCESS_KEY}
    depends_on:
      - postgres
      - redis
      - auth_service
    restart: unless-stopped
    networks:
      - mother_mesh

  # ==========================================
  # 7. ASYNC BACKGROUND WORKER
  # ==========================================
  presentation_worker:
    build:
      context: ..
      dockerfile: services/presentation_service/Dockerfile
    container_name: mother_presentation_worker
    command: ["python", "-m", "backend.api.tasks.worker"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PRESENTATION_DATABASE_URL=postgresql://vitya_user:vitya_secret@postgres:5432/presentation_db
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    networks:
      - mother_mesh

  # ==========================================
  # 8. PERSISTENCE & MESSAGING INFRASTRUCTURE
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: mother_postgres
    environment:
      - POSTGRES_USER=vitya_user
      - POSTGRES_PASSWORD=vitya_secret
      - POSTGRES_MULTIPLE_DATABASES=auth_db,finance_db,chat_db,dora_db,presentation_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - mother_mesh

  redis:
    image: redis:7-alpine
    container_name: mother_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - mother_mesh

networks:
  mother_mesh:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
