events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=general_api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=heavy_tasks:10m rate=5r/s;

    # Upstream Microservices Mesh
    upstream auth_upstream         { server auth_service:8001; }
    upstream finance_upstream      { server finance_service:8002; }
    upstream chat_upstream         { server chat_service:8003; }
    upstream dora_upstream         { server dora_service:8004; }
    upstream presentation_upstream { server presentation_service:8005; }

    server {
        listen 80;
        server_name localhost vitya.local;

        # Global Request Limits
        client_max_body_size 50M;

        # Global Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Health Probe for Orchestrator
        location /gateway-health {
            return 200 '{"status":"healthy","gateway":"nginx","version":"1.25"}';
            add_header Content-Type application/json;
        }

        # 1. Centralized Auth & Core Service (:8001)
        location /api/auth/ {
            limit_req zone=general_api burst=20 nodelay;
            proxy_pass http://auth_upstream/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Finance Service (:8002)
        location /api/finance/ {
            limit_req zone=general_api burst=30 nodelay;
            proxy_pass http://finance_upstream/api/finance/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Chat Service (:8003) - Supports Streaming SSE & WebSockets
        location /api/chat/ {
            limit_req zone=general_api burst=40 nodelay;
            proxy_pass http://chat_upstream/api/chat/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        # 4. Dora Clinical Service (:8004)
        location /api/dora/ {
            limit_req zone=general_api burst=20 nodelay;
            proxy_pass http://dora_upstream/api/dora/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. Presentation Studio Service (:8005)
        location /api/presentation/ {
            limit_req zone=heavy_tasks burst=10 nodelay;
            proxy_pass http://presentation_upstream/api/presentation/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }
}
