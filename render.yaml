version: "1"
services:
  - type: web
    name: MOTHER
    runtime: python
    repo: https://github.com/mrparihar08/MOTHER
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://vitya-chat.onrender.com
      - key: ML_API_BASE
        value: https://mother-8599.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: vitya-database
          property: connectionString
      - key: REDIS_URL
        sync: false # Set Redis URL (e.g. from Render Redis / Redis Cloud) to enable distributed worker queue
      - key: DORA_SERVICE_URL
        sync: false # Optional URL of isolated DORA microservice (e.g. https://dora-clinical.onrender.com)

  - type: worker
    name: MOTHER-worker
    runtime: python
    repo: https://github.com/mrparihar08/MOTHER
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.api.tasks.worker
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vitya-database
          property: connectionString
      - key: REDIS_URL
        sync: false

  - type: web
    name: dora-clinical-microservice
    runtime: python
    repo: https://github.com/mrparihar08/MOTHER
    plan: free
    region: oregon
    buildCommand: pip install -r services/dora_service/requirements.txt
    startCommand: uvicorn services.dora_service.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production

  - type: cron
    name: MOTHER-storage-cleanup
    runtime: python
    repo: https://github.com/mrparihar08/MOTHER
    schedule: "0 2 * * *" # Daily at 02:00 UTC
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.presentation.services.cleanup_service 24

