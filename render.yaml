version: "1"
services:
  - type: web
    name: MOTHER
    runtime: python
    repo: https://github.com/mrparihar08/MOTHER
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app.app:app
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        value: change-me
      - key: ML_API_BASE
        value: https://mother-8599.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: vitya-database
          property: connectionString

  - type: web
    name: vitya-ai-ml
    runtime: python
    repo: https://github.com/mrparihar08/MOTHER
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app.app:app
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vitya-database
          property: connectionString

# NOTE: Frontend is deployed separately from its dedicated frontend repository.
